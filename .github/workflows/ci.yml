name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        php: ['7.4', '8.2', '8.5']

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: ${{ matrix.php }}
          coverage: none
          tools: composer:2

      - name: Validate locked dependencies
        run: |
          composer validate --strict
          composer install --prefer-dist --no-interaction --no-progress
          composer audit --locked --no-interaction

      - name: Run tests
        run: composer test

      - name: Build deterministic release evidence
        run: |
          mkdir -p dist
          bash scripts/build-release.sh dist/ashbi-subscriptions-${{ github.sha }}.zip
          bash scripts/build-release-evidence.sh dist/ashbi-subscriptions-${{ github.sha }}.zip dist/ashbi-subscriptions-${{ github.sha }}
          test -s dist/ashbi-subscriptions-${{ github.sha }}.sha256
          test -s dist/ashbi-subscriptions-${{ github.sha }}.manifest
          (cd dist && sha256sum --check ashbi-subscriptions-${{ github.sha }}.sha256)
          grep -q '^source_commit=${{ github.sha }}$' dist/ashbi-subscriptions-${{ github.sha }}.manifest
          grep -q '^dirty_tree=no$' dist/ashbi-subscriptions-${{ github.sha }}.manifest

      - name: Run static analysis
        run: composer lint:phpstan

      - name: Run security-sensitive coding standards
        run: vendor/bin/phpcs --warning-severity=0 --sniffs=WordPress.Security.NonceVerification,WordPress.DB.PreparedSQL

  coding-standards-baseline:
    name: Coding standards baseline
    runs-on: ubuntu-latest
    continue-on-error: true

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 # 2.37.2
        with:
          php-version: '8.5'
          coverage: none
          tools: composer:2

      - name: Report inherited WordPress coding-standard debt
        run: |
          composer install --prefer-dist --no-interaction --no-progress
          vendor/bin/phpcs --report=summary

  wordpress-integration:
    name: WordPress and WooCommerce integration
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: npm

      - name: Install integration tooling
        run: npm ci --ignore-scripts

      - name: Audit integration dependencies
        run: npm audit --audit-level=moderate

      - name: Check JavaScript and JSX syntax
        run: npm run lint:js

      - name: Start disposable WordPress
        run: npm run env:start

      - name: Run security-boundary integration checks
        run: npm run test:integration

      - name: Stop disposable WordPress
        if: always()
        run: npm run env:stop
